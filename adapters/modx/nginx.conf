# Правила MODX. restore.sh кладёт этот файл в nginx/adapter/modx.conf стека,
# ядро подключает его сразу после запрета точечных файлов, до любого другого
# регулярного блока. Проверяются трассером:
#   scripts/verify-tracer.sh --uploads assets/images --allow assets/components \
#       --deny /core/config/config.inc.php \
#       --deny /core/verify-tracer-probe.php --deny /setup/index.php

# Путь для MODX. Дружественные адреса MODX читает только из параметра q, как
# его передавал FURL-блок .htaccess; из REQUEST_URI он не читает ничего, и без
# q каждый адрес отвечает 200 и рисует главную.
#
# Путь берётся из $request_uri, который ещё не декодирован, а не из $uri.
# Декодированный путь подставил бы в строку запроса то, что посетитель
# закодировал: /katalog%26q%3Dother пришёл бы как q=katalog&q=other, и PHP
# взял бы второй q, то есть другую страницу по чужому адресу. Из сырого пути
# PHP декодирует q один раз, и получается ровно то, что запрошено.
#
# q стоит последним: из повторов PHP берёт последний, и q из строки запроса
# (/katalog/?q=other) не перебивает путь. Прежний сервер ставил q первым и
# такую подмену пропускал. Буквальный незакодированный & в пути остаётся
# разделителем и здесь: это равносильно прямому запросу другой страницы.
#
# map здесь не годится: он живёт на уровне http, а этот файл внутри server.
set $modx_path '';
if ($request_uri ~ "^/(?<modx_raw>[^?]*)") {
    set $modx_path $modx_raw;
}
set $front_query "$args&q=$modx_path";

# Ядро MODX: конфиг с паролем базы, кэш, пакеты, журналы. Менеджер и
# коннекторы ходят туда включениями PHP, а не по HTTP, так что закрыт каталог
# целиком. Префиксный блок с ^~ побеждает любой регулярный, в том числе
# `\.php$` ядра.
location ^~ /core/ {
    deny all;
}

# Установщик. restore.sh его в докрут не кладёт, запрет на случай, если его
# туда вернут: он переустанавливает сайт любому, кто откроет адрес.
location ^~ /setup/ {
    deny all;
}

# Исполнение PHP в assets/ не режется огульно: коннекторы компонентов
# (формы, каталог товаров, генератор миниатюр) живут в assets/components/ и
# без PHP не работают. Всё остальное в assets/ это загрузки медиатеки и
# шаблон, и исполнять там нечего. Регулярный блок, а не префиксный: он обязан
# проиграть ^~ выше и выиграть у `\.php$` ядра.
location ~* ^/assets/(?!components/).*\.(?:php[0-9]?|phtml|phar|pl|py|cgi|sh)$ {
    deny all;
}
