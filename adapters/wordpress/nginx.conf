# Запреты WordPress. restore.sh кладёт этот файл в nginx/adapter/wordpress.conf
# стека, ядро подключает его сразу после запрета точечных файлов, до любого
# другого регулярного блока. Проверяются трассером:
#   scripts/verify-tracer.sh --uploads wp-content/uploads --deny /xmlrpc.php --deny /wp-config.php

# Загрузки WordPress живут в wp-content/uploads, а не в /uploads/ ядра. Без
# этого блока PHP, положенный в медиатеку, исполняется по прямой ссылке: ровно
# так на заражённом хостинге появлялись вебшеллы. Регулярный блок, а не
# префиксный: префиксный проиграл бы блоку `\.php$` ядра.
location ~* ^/wp-content/uploads/.*\.(?:php[0-9]?|phtml|phar|pl|py|cgi|sh)$ {
    deny all;
}

# Кэш плагинов и временный каталог обновлений: там лежит сгенерированное, но
# исполнять оттуда нечего.
location ~* ^/wp-content/(?:cache|upgrade)/.*\.(?:php[0-9]?|phtml|phar)$ {
    deny all;
}

# Точка входа для перебора паролей пачкой в одном запросе. Точное совпадение
# разбирается раньше любого регулярного блока.
location = /xmlrpc.php {
    deny all;
}

# Конфиг с реквизитами базы. Исполнение ничего не выводит, но закрыт он явно:
# ошибка в конфиге PHP-FPM однажды отдаст исходник.
location = /wp-config.php {
    deny all;
}

location = /wp-config-sample.php {
    deny all;
}

# Лог отладки пишется в wp-content при включённом WP_DEBUG_LOG.
location = /wp-content/debug.log {
    deny all;
}
