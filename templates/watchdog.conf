# Настройки сторожа целостности. Читают scripts/watchdog-baseline.py и
# scripts/watchdog-check.py. Секретов здесь нет.
#
# Формат: ключ=значение, по одному на строку. exclude повторяемый.

# Где лежат эталон и журнал прогонов. Вне тома сайта: сайт не должен иметь
# возможности переписать то, с чем его сверяют.
state_dir={{STACK_DIR}}/watchdog

# Публичный файл правил обхода сверяется побайтово с тем, что отдаёт сайт
# снаружи: так видна и подмена файла, и подмена ответа веб-сервером.
robots_url=https://{{DOMAIN}}/robots.txt

# Схема сайта и два запроса, каждый возвращает одно число. Запросы пишет
# адаптер CMS: что считать пользователем и опубликованным объектом, знает
# только он. Пустой запрос означает «не проверяется» и печатается в отчёте.
db_name={{SLUG}}
users_sql=
objects_sql=

# Каталог загрузок относительно докрута. Исключение, которое его накрывает,
# сторож отвергает: это самое частое место для подсаженного файла.
uploads=uploads

# Узкие исключения, префикс пути относительно докрута: кэш и временное.
#exclude=cache/
