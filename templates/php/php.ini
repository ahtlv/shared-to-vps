; Лимиты рассчитаны под небольшую площадку на общем со стеком лимите памяти
; контейнера php-fpm. Адаптер CMS правит своим слоем, если сайту нужно больше.
memory_limit = 256M

upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 120

expose_php = Off
; Посетителю ошибки не показываем, но и не теряем: они уходят в stderr
; контейнера, то есть в docker logs.
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Нейтральный дефолт ядра. Часовой пояс площадки живёт в адаптере CMS: без
; него PHP не молчит, а один раз пишет в лог на каждый вызов дат, и это видно.
date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 96
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
; Файлы сайта меняются деплоем, а не сами по себе, поэтому проверять их дату на
; каждом запросе (значение 0) незачем. Полностью отключает проверку не это, а
; opcache.validate_timestamps=0 — с ним изменение подхватилось бы только после
; перезапуска пула, и деплой-скрипты пришлось бы учить его дёргать.
opcache.revalidate_freq = 2
