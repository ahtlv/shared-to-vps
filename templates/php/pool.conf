[www]
; Пул поднимается по требованию и уходит через полминуты простоя: ядро не
; предполагает, каким трафиком будет жить площадка.
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Пинг обслуживает сам FPM, до PHP-кода и приложения запрос не доходит. На
; него смотрит healthcheck nginx: так проверка идёт насквозь через php-fpm, но
; не дёргает сайт и не греет его кэш чужим Host.
ping.path = /ping
ping.response = pong

; Замедления видно в логе, а не только в жалобах.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s
request_terminate_timeout = 120s

; Логи FPM уходят в stdout/stderr контейнера, чтобы их собирал docker logs.
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no
