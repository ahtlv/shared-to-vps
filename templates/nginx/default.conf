# Ядро от CMS не зависит: каталог загрузок и запреты названы обобщённо, а не
# по конкретной структуре WordPress или MODX. Своё для CMS живёт в адаптере.
#
# Правки этого файла заливать только через `cat >` или `scp`, но не `sed -i` и
# не `mv`: он смонтирован в контейнер отдельным файлом, то есть привязан к
# inode. Подменённый файл контейнер не увидит, при этом `nginx -t` и `reload`
# отрапортуют успех по старой копии. После правки сверять md5sum внутри и
# снаружи.

server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html;
    charset utf-8;

    client_max_body_size 32m;

    # Это и так дефолт, но запрет листингов входит в приёмку, а дефолты
    # меняются между версиями образа.
    autoindex off;

    # Версию nginx посетителю знать незачем.
    server_tokens off;

    # Пинг обслуживает сам FPM, не PHP-код сайта. Сюда смотрит healthcheck
    # nginx: проверка идёт насквозь до php-fpm, но не дёргает приложение и не
    # греет его кэш чужим Host. Снаружи не нужен никому.
    location = /healthz {
        allow 127.0.0.1;
        deny all;
        # fastcgi_params здесь намеренно не подключается: он объявляет
        # SCRIPT_NAME как $fastcgi_script_name, а повторный fastcgi_param не
        # заменяет значение, а уходит на FPM вторым. FPM берёт первое, не
        # узнаёт ping.path и отвечает 404 «File not found».
        fastcgi_param SCRIPT_NAME /ping;
        # Без SCRIPT_FILENAME FPM не заполняет request_uri, а именно с ним он
        # сверяет ping.path. Пул тогда до пинга не доходит и отвечает 404.
        fastcgi_param SCRIPT_FILENAME /ping;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param QUERY_STRING "";
        fastcgi_pass php-fpm:9000;
    }

    # Точные совпадения разбираются раньше регулярных выражений, поэтому этот
    # запрет не зависит от порядка блоков ниже.
    #
    # readme.html и подобные файлы ядра CMS выдают точную версию сборки.
    # Список конкретных точек входа (xmlrpc.php и т.п.) живёт в адаптере.
    location = /readme.html {
        deny all;
    }

    # Файлы и каталоги с ведущей точкой: .git, .env, .htaccess, .user.ini и
    # прочее, что попадает в docroot вместе с архивом. Исключение только для
    # ACME.
    #
    # ЭТОТ БЛОК ОБЯЗАН СТОЯТЬ ПЕРВЫМ среди регулярных. Если он уезжает ниже
    # блока `\.php$`, то `/.secret.php` начинает ИСПОЛНЯТЬСЯ: nginx берёт
    # первый совпавший регулярный блок, и `\.php$` совпадает раньше. Это ровно
    # тот вектор, которым заражали старый хостинг.
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # Запреты адаптера CMS: свой каталог загрузок, свои точки входа, свой
    # конфиг с реквизитами. Подключаются здесь, сразу после точечных файлов и
    # до любого другого регулярного блока, потому что nginx берёт первый
    # совпавший: запрет PHP в загрузках, подключённый ниже `\.php$`, не
    # сработал бы никогда. Каталог смонтирован целиком, а не по файлу, поэтому
    # новый файл адаптера доезжает до контейнера без пересоздания.
    #
    # Строка запроса фронт-контроллера тоже принадлежит CMS, а не ядру: ядро
    # задаёт её по умолчанию, адаптер переопределяет в своём файле. WordPress
    # читает путь из REQUEST_URI и берёт строку запроса как есть. MODX путь из
    # REQUEST_URI не читает вовсе, ему нужен параметр q, и без него каждый
    # адрес отвечает 200 и рисует главную. Переопределить `location /` целиком
    # адаптер не может: второй такой блок nginx не примет.
    set $front_query $args;
    include /etc/nginx/adapter/*.conf;

    # ВАЖНО: порядок регулярных блоков значим — nginx берёт первый совпавший.
    # Запрет PHP в каталоге загрузок обязан стоять раньше общего блока `\.php$`.
    #
    # Именно так на старом хостинге появлялись вебшеллы: файл клали в медиатеку
    # и дёргали по прямой ссылке. Ничего исполняемого в загрузках нет и быть не
    # должно. Путь каталога загрузок задаёт адаптер подключаемым файлом; здесь
    # обобщённый /uploads/, общий для ядра.
    location ~* ^/uploads/.*\.(?:php[0-9]?|phtml|phar|pl|py|cgi|sh)$ {
        deny all;
    }

    # Оставленные рядом с конфигом копии и дампы. На заражённом хостинге такой
    # файл дважды оказывался доступен по прямой ссылке.
    location ~* \.(?:bak|old|orig|save|swp|sql|sql\.gz|tar|tar\.gz|tgz|zip|log)$ {
        deny all;
    }

    # .user.ini переопределяет настройки PHP и в чужих руках снимает лимиты.
    # Формально его закрывает и блок точечных файлов выше, но запрет назван
    # явно: он входит в приёмку и не должен зависеть от чужого правила.
    location ~* /\.user\.ini {
        deny all;
    }

    # Статика с длинным сроком жизни. Блок стоит после запретов, поэтому .php в
    # загрузках сюда уже не попадёт.
    location ~* \.(?:css|js|jpe?g|png|gif|webp|avif|svg|ico|woff2?|ttf|eot|mp4|webm)$ {
        try_files $uri =404;
        # Не `expires 1y` вдобавок: та директива выставляет собственный
        # Cache-Control, и заголовок уехал бы в ответе дважды.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$front_query;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        # Обратный прокси — единственная точка входа и в проде всегда
        # завершает TLS. До переключения DNS его HTTP-only блок служит
        # стендом, но приложение и там должно видеть целевой HTTPS-контекст.
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass php-fpm:9000;
        fastcgi_read_timeout 120s;
    }
}
