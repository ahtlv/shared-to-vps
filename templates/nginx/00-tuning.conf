# Директивы уровня http. Живут отдельным файлом, потому что default.conf это
# уже блок server, а real_ip внутрь него не помещается.

# Реальный IP посетителя. Без этого PHP видел бы адрес контейнера обратного
# прокси как REMOTE_ADDR у каждого визита.
#
# Подсеть {{EDGE_NETWORK_SUBNET}} это подсеть сети {{EDGE_NETWORK}}, а не
# широкая маска: приложение этого стека сидит во внутренней сети и туда же
# смотрит php-fpm, но при широкой маске скомпрометированный код мог бы сам
# сходить на nginx с подставленным X-Forwarded-For и записать в лог и в
# антиспам любой чужой адрес.
#
# Плата за точность: если сеть {{EDGE_NETWORK}} когда-нибудь пересоздадут с
# другой подсетью, real_ip молча перестанет работать, а само по себе это не
# упадёт ни на одной автоматической проверке — реальный адрес посетителя
# нечем утвердить живым пробником так же, как исполнение PHP. Соответствие
# значения профиля актуальной подсети сети остаётся ручной сверкой на Ф4.
set_real_ip_from {{EDGE_NETWORK_SUBNET}};
real_ip_header X-Forwarded-For;
# Обратный прокси не перезаписывает X-Forwarded-For, а дописывает свой адрес в
# конец. Поэтому посетитель может прислать заголовок сам. recursive on идёт по
# списку справа налево, пропуская доверенные адреса, и останавливается на
# первом недоверенном — то есть на настоящем адресе соединения, а не на
# подставленном.
real_ip_recursive on;
