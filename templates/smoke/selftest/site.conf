# Конфиг смоука для подставного сайта самотеста. Формат тот же, что у
# ../smoke.conf; значения описывают fake_site.py, а не настоящую площадку.
host=example.test
marker=<meta name="generator" content="ExampleCMS
page=/about/
page=/contacts/
forbid={include 
forbid=Fatal error
sitemap=/sitemap.xml
robots=robots.txt
www_path=/about/
expect=/about/ Работаем с 2005 года.
expect=/contacts/ Пишите.
form_url=/form
form_capture=token=data-token="\([^"]*\)"
form_field=name
form_field=phone
form_header=X-Requested-With: XMLHttpRequest
form_rejected="success":false
form_rejected="name":"required"
form_rejected="phone":"required"
form_accepted="success":true
