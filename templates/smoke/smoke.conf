# Конфиг смоука площадки. Формат: ключ=значение, значение от первого `=` до
# конца строки как есть, без кавычек. Повторяемые ключи задаются по одному на
# строку. Строки с # и пустые пропускаются.
#
# Имя подставляет рендер из профиля. Остальное принадлежит CMS и сайту и
# заполняется адаптером или руками: смоук с пустым обязательным полем
# отказывается запускаться (код 2), а не проверяет вполсилы.

# Основное имя сайта, без схемы и www.
host={{DOMAIN}}

# ОБЯЗАТЕЛЬНО. Буквальная строка, которая есть в теле главной только когда её
# отрендерило приложение: мета-тег генератора, идентификатор счётчика, класс
# корневого элемента темы. Страница хостинга «сайт не найден» её не содержит.
marker=

# ОБЯЗАТЕЛЬНО, повторяемый, не меньше двух. Внутренние страницы разных
# типов: раздел, запись, карточка. Каждая сравнивается с главной и со всеми
# остальными по телу и по <title>. Одной мало: копия бывает и не главной.
page=

# ОБЯЗАТЕЛЬНО, повторяемый. Эталон из слепка старой площадки: путь и через
# пробел буквальный текст, который на этой странице был до переезда.
# Заголовок с кириллицей, цена, телефон. Сравнение тел между собой не видит
# того, что испорчено одинаково на всех страницах: кодировку, ставшую
# вопросами, пропавший блок шаблона. Слепка нет совсем: expect=none, и отказ
# от сравнения будет напечатан в выводе.
expect=

# Сравнивать ли <title> вдобавок к телу. no только для сайта, у которого один
# заголовок на всех страницах: иначе каждая страница будет «копией главной».
#compare_titles=yes

# Повторяемый. Буквальные фрагменты, которых не бывает в теле живой страницы:
# сырой синтаксис шаблонизатора, текст фатальной ошибки движка.
#forbid=Fatal error

# Путь к карте сайта. По умолчанию /sitemap.xml.
#sitemap=/sitemap.xml

# ОБЯЗАТЕЛЬНО. Эталон robots.txt из снимка, путь относительно этого файла.
# Сравнивается байт в байт: подменённая заглушка тоже отвечает 200.
robots=robots.txt.reference

# Путь для проверки редиректа www. По умолчанию первый page.
#www_path=

# ОБЯЗАТЕЛЬНО. Адрес, куда форма отправляет POST, или none, если формы нет.
form_url=
# Страница, на которой стоит форма. По умолчанию главная. Запрашивается заново
# прямо перед отправкой, чтобы токен формы был свежим.
#form_page=/
# Значения, которые надо взять со страницы формы перед отправкой: ИМЯ=регулярное
# выражение sed (BRE) с одной группой. Токен формы, её идентификатор.
#form_capture=token=data-token="\([^"]*\)"
# Технические параметры запроса с фиксированным значением: ИМЯ=ЗНАЧЕНИЕ.
#form_param=action=submit
# Обязательные поля, только имя. Смоук всегда отправляет их пустыми.
#form_field=name
#form_field=phone
#form_header=X-Requested-With: XMLHttpRequest
# Ожидаемый код ответа обработчика формы. По умолчанию 200.
#form_status=200
# Все эти строки обязаны быть в ответе: доказательство, что валидация
# отработала по пустым полям, а не ответ «что-то пошло не так».
#form_rejected="success":false
# Ни одной из этих строк в ответе быть не должно.
#form_accepted="success":true
