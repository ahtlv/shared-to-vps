# Настройки внешней копии. Читает scripts/backup-offsite.sh.
#
# Шифрование публичным ключом age. На сервере лежит только получатель
# (age1...), закрытый ключ хранится у владельца вне сервера: иначе одна
# компрометация забирает и площадку, и архив. Строку с AGE-SECRET-KEY скрипт
# отвергает.
recipient=

# Куда класть: удалённое хранилище rclone (имя:путь) или локальный путь.
# Реквизиты хранилища живут в конфиге rclone на сервере, не здесь. Выдайте
# серверу учётку без права удаления, если хранилище так умеет, а срок
# хранения задайте правилами хранилища: скрипт старые копии не трогает.
remote=
