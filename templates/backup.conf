# Настройки бэкапа площадки. Читает scripts/backup.sh. Секретов здесь нет и
# быть не должно: значения паролей скрипт берёт из secrets_file сам и только
# для того, чтобы убедиться, что в набор они не попали.
#
# Формат: ключ=значение, по одному на строку. exclude и expect повторяемые,
# для остальных побеждает последняя строка.

# Схема сайта в базе. Адаптер CMS создаёт её под этим именем или правит строку.
db_name={{SLUG}}

# Сколько завершённых наборов держать. Считаются наборы, а не дни.
keep=14

# Вне тома сайта и вне каталога стека: набор не должен уехать в архив
# следующего набора и не должен быть виден веб-серверу.
backup_dir=/var/backups/{{SLUG}}

# Файл окружения с паролями, права 600. Значения ключей, в имени которых есть
# PASS, SECRET, TOKEN, KEY, SALT или AUTH, от восьми символов, ищутся в
# наборе, и найденное роняет бэкап. Имя базы и пользователя не ищутся: они
# встречаются в любом дампе. Без образцов проверка ничего не
# доказывает, поэтому отсутствие файла тоже отказ. Отключить можно только
# явно: secrets_file=none.
secrets_file={{STACK_DIR}}/.env

# Пути в докруте, которые в набор не кладутся: реквизиты и одноразовое.
# Глоб, как у find -path, относительно докрута. Ядро само исключает .env,
# .env.* и error_log на любой глубине. Своё дописывает адаптер: конфиг CMS с
# паролем базы, кэш. Каталог загрузок не исключать никогда.
#exclude=cache

# Пути, которые обязаны найтись в распакованном архиве. Адаптер называет
# точку входа CMS: без неё набор формально цел, но сайт из него не встанет.
#expect=index.php
